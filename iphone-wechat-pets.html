<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>桌面宠物</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f6f2e8;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
      linear-gradient(90deg, rgba(60, 60, 60, .08) 1px, transparent 1px) 0 0 / 36px 36px,
      linear-gradient(0deg, rgba(60, 60, 60, .06) 1px, transparent 1px) 0 0 / 36px 36px,
      #f6f2e8;
  }
  .pet {
    position: absolute;
    width: min(36vw, 180px);
    height: auto;
    will-change: transform;
    transform-origin: center bottom;
    filter: drop-shadow(0 8px 10px rgba(0, 0, 0, .22));
    -webkit-tap-highlight-color: transparent;
  }
  .bubble {
    position: absolute;
    display: none;
    padding: 7px 17px;
    border: 2px solid #111;
    border-radius: 15px;
    background: white;
    color: #111;
    font-weight: 800;
    font-size: 28px;
    line-height: 1;
    transform: translate(-50%, -100%);
    box-shadow: 0 3px 8px rgba(0, 0, 0, .16);
    pointer-events: none;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -10px;
    width: 16px;
    height: 16px;
    transform: translateX(-50%) rotate(45deg);
    background: white;
    border-right: 2px solid #111;
    border-bottom: 2px solid #111;
  }
  .hint {
    position: fixed;
    left: env(safe-area-inset-left, 0);
    right: env(safe-area-inset-right, 0);
    bottom: calc(env(safe-area-inset-bottom, 0) + 10px);
    text-align: center;
    color: rgba(0, 0, 0, .42);
    font-size: 12px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="pet" id="pet-left" alt="">
  <div class="bubble" id="bubble-left">爹</div>
  <img class="pet" id="pet-right" alt="">
  <div class="bubble" id="bubble-right">爹</div>
  <div class="hint">点一下任意人物</div>
</div>

const stage = document.getElementById("stage");

class Pet {
  constructor(name, x, y, speed) {
    this.name = name;
    this.el = document.getElementById(`pet-${name}`);
    this.bubble = document.getElementById(`bubble-${name}`);
    this.frames = SPRITES[name].crawl;
    this.hover = SPRITES[name].hover;
    this.frame = 0;
    this.x = x;
    this.y = y;
    this.vx = (Math.random() < .5 ? -1 : 1) * speed;
    this.vy = (Math.random() < .5 ? -1 : 1) * speed * .7;
    this.until = 0;
    this.el.src = this.frames[0];
    this.el.addEventListener("click", () => callDad());
    this.el.addEventListener("touchend", (event) => { event.preventDefault(); callDad(); }, {passive:false});
  }
  obey(now) {
    this.until = now + 2000;
    this.el.src = this.hover;
    this.bubble.style.display = "block";
  }
  move(now, bounds) {
    const obeying = now < this.until;
    if (!obeying) {
      this.bubble.style.display = "none";
      if (Math.random() < .018) this.turn();
      this.x += this.vx;
      this.y += this.vy;
      const w = this.el.offsetWidth || 160;
      const h = this.el.offsetHeight || 135;
      if (this.x < 0 || this.x + w > bounds.w) { this.vx *= -1; this.x = Math.max(0, Math.min(this.x, bounds.w - w)); }
      if (this.y < 0 || this.y + h > bounds.h) { this.vy *= -1; this.y = Math.max(0, Math.min(this.y, bounds.h - h)); }
      this.frame = (this.frame + 1) % this.frames.length;
      this.el.src = this.frames[this.frame];
    }
    this.render();
  }
  turn() {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.8 + Math.random() * 2.8;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
  }
  render() {
    const facing = this.vx < 0 ? -1 : 1;
    this.el.style.transform = `translate(${this.x}px, ${this.y}px) scaleX(${facing})`;
    this.bubble.style.left = `${this.x + (this.el.offsetWidth || 160) / 2}px`;
    this.bubble.style.top = `${this.y - 5}px`;
  }
}

const pets = [
  new Pet("left", innerWidth * .08, innerHeight * .58, 3.2),
  new Pet("right", innerWidth * .48, innerHeight * .26, 2.9),
];

function callDad() {
  const now = performance.now();
  for (const pet of pets) pet.obey(now);
  playBark();
}

function playBark() {
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (!AudioContext) return;
  const context = new AudioContext();
  const bark = (delay) => {
    const oscillator = context.createOscillator();
    const gain = context.createGain();
    oscillator.type = "sawtooth";
    oscillator.frequency.setValueAtTime(460, context.currentTime + delay);
    oscillator.frequency.exponentialRampToValueAtTime(150, context.currentTime + delay + .18);
    gain.gain.setValueAtTime(.0001, context.currentTime + delay);
    gain.gain.exponentialRampToValueAtTime(.22, context.currentTime + delay + .015);
    gain.gain.exponentialRampToValueAtTime(.0001, context.currentTime + delay + .2);
    oscillator.connect(gain).connect(context.destination);
    oscillator.start(context.currentTime + delay);
    oscillator.stop(context.currentTime + delay + .21);
  };
  context.resume().then(() => { bark(0); bark(.26); }).catch(() => {});
}

function tick(now) {
  const bounds = {w: innerWidth, h: innerHeight};
  for (const pet of pets) pet.move(now, bounds);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
